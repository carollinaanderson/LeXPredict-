[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimvalue-ml"
version = "0.1.0"
description = "Leakage-safe ML pipeline for predicting claim value and ruling outcome from anonymized court-case data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    "mlflow-skinny>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2"]
dl = ["torch>=2.2"]
eda = ["matplotlib>=3.8", "tabulate>=0.9"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4", "httpx>=0.27", "matplotlib>=3.8", "tabulate>=0.9"]

[project.scripts]
claimvalue = "claimvalue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claimvalue = ["sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by `ruff format`; long prose strings are fine

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
